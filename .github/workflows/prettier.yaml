name: Format with Prettier

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prettify code
        uses: creyD/prettier_action@v4.3
        with:
          prettier_options: --write .
          github_token: ${{ secrets.WORKFLOW_TOKEN }}

